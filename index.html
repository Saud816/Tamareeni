<style>
/* Layout: week strip, day tabs, one card per exercise (name, sets and reps, video, done button). Two tabs only. */

/* Layout: sticky week strip on top, one scrolling column of exercise cards, three-tab bar at the bottom.

:root{--bg:#F3F1EC;--card:#FFFFFF;--ink:#1A222C;--mute:#66707C;--line:#DCD8CF;--acc:#D8451F;--acc-ink:#FFFFFF;--acc-soft:#FBE4DC;--cool:#2D6C8C;--cool-soft:#DDEAF1;--ok:#2B8A57;--ok-soft:#DDF0E5;--bad:#C23B3B;--bad-soft:#F7DEDE;--field:#F7F6F2;--c1:#2D6C8C;--s1:#DDEAF1;--c2:#B7791F;--s2:#F8EAD0;--c3:#7A4FA3;--s3:#EBE1F4;--c4:#2B8A57;--s4:#DDF0E5;--c5:#C23B6B;--s5:#F6DEE8;--c6:#4A5A70;--s6:#E1E6EE;
--f-ar:"Cairo","Segoe UI",Tahoma,sans-serif;--f-num:"Barlow Condensed","Cairo",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171D;--card:#1B222B;--ink:#ECEFF3;--mute:#99A4B1;--line:#2E3844;--acc:#FF7A4D;--acc-ink:#1A0E08;--acc-soft:#3A2218;--cool:#79B6D6;--cool-soft:#1D3340;--ok:#52C58A;--ok-soft:#173226;--bad:#F08585;--bad-soft:#3A1E1E;--field:#151B22;--c1:#79B6D6;--s1:#1D3340;--c2:#E6B450;--s2:#3A2E14;--c3:#B79AE0;--s3:#2C2140;--c4:#52C58A;--s4:#173226;--c5:#F08AB0;--s5:#3A1E2A;--c6:#A6B4C8;--s6:#26303D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171D;--card:#1B222B;--ink:#ECEFF3;--mute:#99A4B1;--line:#2E3844;--acc:#FF7A4D;--acc-ink:#1A0E08;--acc-soft:#3A2218;--cool:#79B6D6;--cool-soft:#1D3340;--ok:#52C58A;--ok-soft:#173226;--bad:#F08585;--bad-soft:#3A1E1E;--field:#151B22;--c1:#79B6D6;--s1:#1D3340;--c2:#E6B450;--s2:#3A2E14;--c3:#B79AE0;--s3:#2C2140;--c4:#52C58A;--s4:#173226;--c5:#F08AB0;--s5:#3A1E2A;--c6:#A6B4C8;--s6:#26303D;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
bdi,.en{unicode-bidi:isolate}
header.top{background:var(--bg);padding:10px 0 6px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
h1{font-size:22px;margin:0;font-weight:900}
.wave{font:700 15px var(--f-ar);color:var(--c,var(--mute));background:var(--s,transparent);border-radius:999px;padding:2px 12px}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wv1{--c:var(--c1);--s:var(--s1)}.wv2{--c:var(--c2);--s:var(--s2)}.wv3{--c:var(--c3);--s:var(--s3)}.wv4{--c:var(--c4);--s:var(--s4)}.wv5{--c:var(--c5);--s:var(--s5)}.wv6{--c:var(--c6);--s:var(--s6)}
.wk{flex:0 0 auto;width:46px;height:46px;border-radius:12px;border:2px solid var(--c,var(--line));background:var(--s,var(--card));font:700 22px var(--f-num);position:relative}
.wk[aria-pressed="true"]{background:var(--c,var(--ink));color:var(--bg);border-color:var(--c,var(--ink))}
.wk.has::after{content:"";position:absolute;top:5px;inset-inline-start:5px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.wk.wstart{margin-inline-start:8px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 10px}
.dy{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.dy b{display:block;font-size:15px}
.dy small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
.days .dy{border:2px solid var(--c,var(--line))}
.dy[aria-pressed="true"]{background:var(--c,var(--acc));color:var(--bg)}
.dy[aria-pressed="true"] small{color:var(--bg);opacity:.9}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.barlbl{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:6px 0 12px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:clip}
.ex.done{border-color:var(--ok)}
.hd{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:12px 14px;text-align:start}
.hdw{display:flex;align-items:center}
.hdw.open{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 3px 8px rgba(0,0,0,.08)}
.hdw .hd{flex:1;width:auto;min-width:0}
.vls{display:flex;flex-direction:column;gap:6px;padding-inline-end:12px;flex:0 0 auto}
.vls .donebtn{border:2px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:4px 12px;font:900 15px var(--f-ar);min-height:38px;white-space:nowrap}
.vls .donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.vls a{border:1px solid var(--cool);color:var(--cool);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;min-height:34px;display:flex;align-items:center}
.hd[aria-expanded="true"] .ar,.hd[aria-expanded="true"] .chip:not(.b){display:none}
.num{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--field);border:1px solid var(--line);font:700 18px var(--f-num)}
.ex.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.tt{min-width:0;flex:1}
.en{display:block;font:700 19px/1.15 var(--f-num);letter-spacing:.2px;text-align:start}
.ar{display:block;color:var(--mute);font-size:14px}
.pre{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:13px;background:var(--field);border:1px solid var(--line);white-space:nowrap}
.chip.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.chip.s{background:var(--cool-soft);border-color:var(--cool-soft);color:var(--cool);font-weight:600}
.st{font:700 17px var(--f-num);color:var(--mute);white-space:nowrap}
.ex.done .st{color:var(--ok)}
.bd{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.quote{border-inline-start:4px solid var(--acc);padding:2px 10px;font-weight:700;font-size:17px}
.lab{font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.hint{background:var(--field);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.hint b{font-family:var(--f-num);font-size:17px}
.sets{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center}
.sets .h{font-size:13px;color:var(--mute);font-weight:600;text-align:center}
.sn{font:700 20px var(--f-num);text-align:center;color:var(--mute)}
input.f{width:100%;min-width:0;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--field);padding:0 10px;text-align:center;font:600 22px var(--f-num);direction:ltr}
input.f::placeholder{color:var(--mute);opacity:.55}
input.t{width:100%;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--field);padding:0 12px;font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;font-size:15px;min-height:44px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details.inf{border-top:1px solid var(--line);padding-top:8px}
details.inf summary{cursor:pointer;font-weight:700;min-height:32px}
details.inf p{margin:6px 0}
.vl{display:flex;flex-wrap:wrap;gap:8px}
.vl a{display:inline-block;border:1px solid var(--cool);color:var(--cool);border-radius:10px;padding:7px 12px;text-decoration:none;font-weight:600;font-size:14px}
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,1fr);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--mute);min-height:52px}
nav.tabs button[aria-pressed="true"]{color:var(--acc);background:var(--acc-soft)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{position:fixed;z-index:7;inset-inline:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 8px 6px 16px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.pill b{font:700 24px var(--f-num);letter-spacing:.5px}
.pill.go b{color:var(--ok)}
.pill button{border:0;border-radius:999px;background:var(--bg);color:var(--ink);padding:6px 12px;font-weight:600}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi small{color:var(--mute);display:block;font-size:13px}
.kpi b{font:700 28px var(--f-num)}
.kpi span{font-size:13px;font-weight:700}
.up{color:var(--ok)}.dn{color:var(--bad)}
select.sel{width:100%;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:16px}
.seg{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 6px;font-weight:600;font-size:14px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:12px}
.chart svg{display:block;width:100%;height:auto;max-width:100%}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .wv{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:3;stroke-linejoin:round}
.chart .pt{fill:var(--card);stroke:var(--acc);stroke-width:3}
.chart .pt.last{fill:var(--acc)}
.chart text{fill:var(--mute);font:600 11px var(--f-num)}
.chart text.v{fill:var(--ink);font:700 13px var(--f-num)}
.chart text.wl{font:600 10px var(--f-ar)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:14px}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);font:600 15px var(--f-num);white-space:nowrap}
.tbl th{background:var(--field);color:var(--mute);font-size:13px;font-family:var(--f-ar)}
.tbl td.nm,.tbl th.nm{text-align:left;direction:ltr;position:sticky;inset-inline-start:0;background:var(--card);font:600 13px var(--f-ar);max-width:150px;overflow:hidden;text-overflow:ellipsis;z-index:1;border-inline-end:1px solid var(--line)}
.tbl th.nm{background:var(--field)}
.tbl td.u{background:var(--ok-soft);color:var(--ok)}
.tbl td.d{background:var(--bad-soft);color:var(--bad)}
.tbl td.e{color:var(--mute);opacity:.5}
h2{font-size:18px;margin:18px 0 8px;font-weight:900}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.card p{margin:0;color:var(--mute);font-size:14px}
.msg{font-size:14px;font-weight:600;min-height:20px}
.empty{color:var(--mute);text-align:center;padding:22px 10px}
.chip.b{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.plan{font-size:16px}
.bigdone{width:100%;min-height:68px;border-radius:14px;border:0;background:var(--acc);color:var(--acc-ink);font:900 21px var(--f-ar)}
.bigdone.on{background:var(--ok);color:#fff;font-size:17px}
.rows{display:flex;flex-direction:column;gap:8px}
.stepper{display:flex;gap:6px;align-items:center}
.stepper input.f{flex:1}
.stp{flex:0 0 48px;width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:700 28px var(--f-num);line-height:1}
.srow{display:grid;grid-template-columns:24px 1fr 56px;gap:8px;align-items:center}
.srow.pw{grid-template-columns:24px 84px 1fr 56px}
.srow .f.sw{font-size:18px}
.tick{width:56px;height:48px;border-radius:10px;border:2px solid var(--line);background:var(--field);font-size:26px;color:var(--mute)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.srow.on input.f{border-color:var(--ok)}
.rpes{display:flex;gap:6px}
.rpes button{flex:1;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:700 22px var(--f-num)}
.rpes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rpehelp{margin-bottom:12px}
.rpehelp ul{margin:4px 0;padding-inline-start:20px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

</style></head><body>

 h+='<h2>نسخة احتياطية</h2><div class="card"><p>بياناتك محفوظة في هذا المتصفح فقط. احفظ نسخة JSON بين فترة وأخرى، واستوردها في أي جهاز آخر.</p><div class="btns"><button class="btn" data-act="backup">حفظ نسخة JSON</button><label class="btn" for="imp">استيراد نسخة</label><input id="imp" type="file" accept=".json,application/json" hidden></div><div class="msg" id="msg">'+esc(msg)+'</div></div>';
 h+='<div class="card"><p>مسح كل السجلات يحذف التمارين المنجزة والأوزان من هذا المتصفح.</p><div class="btns"><button class="btn bad" data-act="clear">مسح كل البيانات</button></div></div>';
 app.innerHTML=h;
}
function setMsg(t){msg=t;const m=document.getElementById('msg');if(m)m.textContent=t}
async function saveFile(name,data,mime){
 try{if(window.claude&&claude.use){const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:data});setMsg('تم الحفظ: '+name);return}}}catch(e){if(e&&e.code==='declined'){setMsg('أُلغي الحفظ.');return}}
 try{const b=new Blob([data],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);setMsg('تم تجهيز الملف: '+name)}catch(e){setMsg('تعذّر حفظ الملف في هذا العرض.')}
}
function weekSheet(w){
 const rows=[['Wave','Week','Day','Exercise','Sets','Reps','Done','Weight kg']];
 (progOf(w)||[]).forEach(dd=>dd.ex.forEach(x=>{const L=getLog(w,x.id);const t=stats(L);const full=t.filled>=x.sets;const wt=L&&num(L.w0)!==null&&num(L.w0)>0?num(L.w0):(t.top||'');
  rows.push([wave(w),w,dd.day,x.n,x.sets,x.reps,full?'Yes':(t.filled?t.filled+'/'+x.sets:'No'),wt])}));
 return rows;
}
function buildWorkbook(which){
 const wb=XLSX.utils.book_new();const has=hasData();
 const weeks=which==='week'?[S.week]:[...has].sort((a,b)=>a-b);if(!weeks.length)weeks.push(S.week);
 const all=[['Wave','Week','Day','Exercise','Sets','Reps','Done','Weight kg']];
 weeks.forEach(w=>{const r=weekSheet(w);const ws=XLSX.utils.aoa_to_sheet(r);ws['!cols']=[7,7,6,46,6,8,8,10].map(n=>({wch:n}));XLSX.utils.book_append_sheet(wb,ws,'Week '+w);r.slice(1).forEach(x=>all.push(x))});
 const wa=XLSX.utils.aoa_to_sheet(all);wa['!cols']=[7,7,6,46,6,8,8,10].map(n=>({wch:n}));XLSX.utils.book_append_sheet(wb,wa,'All Data');
 return wb;
}
async function exportXl(which){
 if(typeof XLSX==='undefined'){setMsg('مكتبة Excel لم تُحمَّل. تأكد من الاتصال بالإنترنت ثم أعد فتح الصفحة.');return}
 const wb=buildWorkbook(which);const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
 await saveFile(which==='week'?'Tamareeni-Week-'+S.week+'.xlsx':'Tamareeni-All-Weeks.xlsx',buf,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

/* ---------- events ---------- */
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
 if(a==='week'){S.week=+v;save();render()}
 else if(a==='tab'){S.tab=v;save();render();window.scrollTo(0,0)}
 else if(a==='day'){S.day=+v;openId=null;save();render()}
 else if(a==='toggle'){openId=openId===v?null:v;renderLog();if(openId){const el=document.querySelector('[data-id="'+openId+'"]');if(el)el.scrollIntoView({block:'start',behavior:'smooth'})}}
 else if(a==='wt'){const x=byId(v);const L=ensureLog(S.week,v,x.sets,x);L.w0=String(Math.max(0,(num(L.w0)||0)+(+b.dataset.d)));save();keepScroll(renderLog)}
 else if(a==='all'){const x=byId(v);const L=ensureLog(S.week,v,x.sets,x);const was=L.s.slice(0,x.sets).every(q=>isDone(q));L.s.forEach(s0=>{s0.d=!was;if(!was&&!num(s0.r))s0.r=defReps(x)});save();renderHead();if(!was){openId=null;renderLog()}else keepScroll(renderLog)}
 else if(a==='xl'){exportXl(v)}
 else if(a==='backup'){saveFile('Tamareeni-backup.json',JSON.stringify(S),'application/json')}
 else if(a==='clear'){if(b.dataset.sure){S.logs={};save();msg='تم المسح.';render()}else{b.dataset.sure='1';b.textContent='اضغط مرة أخرى للتأكيد'}}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.x&&t.dataset.k==='w0'){const x=byId(t.dataset.x);const L=ensureLog(S.week,x.id,x.sets,x);L.w0=t.value.trim();save()}
 else if(t.dataset.set==='wpw'){const n=Math.max(1,Math.min(9,parseInt(t.value)||3));S.wpw=n;save();renderHead()}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='imp'&&t.files[0]){const f=t.files[0];const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j||typeof j.logs!=='object')throw 0;S=Object.assign(S,j);S.tab='exp';save();setMsg('تم استيراد النسخة الاحتياطية.');render()}catch(er){setMsg('الملف غير صالح.')}};rd.readAsText(f)}
});
render();
setTimeout(()=>{const c=document.querySelector('.wk[aria-pressed="true"]');if(c&&c.scrollIntoView)c.scrollIntoView({inline:'center',block:'nearest'})},50);
</script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}))</script></body></html>
