<title>تماريني</title>

<style>
/* Layout: one column; a segmented switch, a four-day strip, then expandable exercise cards.
   Colour language borrows the colours of competition weight plates. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --ink:#14181F; --muted:#5A6372; --line:#DDE1E9;
  --accent:#1D4FD7; --accent-ink:#FFFFFF; --hot:#C8202F; --warm:#E9A820; --new:#12805A;
  --body:#CDD3DE; --mus:#B3BBCA;
  --f-display:"Times New Roman",Times,"Liberation Serif",serif;
  --f-body:"Times New Roman",Times,"Liberation Serif",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1218; --surface:#171C24; --ink:#E8ECF2; --muted:#98A2B3; --line:#262D38;
    --accent:#7AA2FF; --accent-ink:#0E1218; --hot:#FF6B78; --warm:#F2B93B; --new:#4AD3A0;
    --body:#2A313D; --mus:#3B4452; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1218; --surface:#171C24; --ink:#E8ECF2; --muted:#98A2B3; --line:#262D38;
  --accent:#7AA2FF; --accent-ink:#0E1218; --hot:#FF6B78; --warm:#F2B93B; --new:#4AD3A0;
  --body:#2A313D; --mus:#3B4452; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--f-body);direction:rtl;
  padding-block:20px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:700}
h1{font-size:30px;line-height:1.2}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.day b{font-family:var(--f-display);font-size:17px;font-weight:700}
.day span{font-size:12px;color:var(--muted)}
.day[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.day[aria-selected="true"] b{color:var(--accent)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px}
.head h2{font-size:22px}
.stats{display:flex;gap:14px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
details.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.ex>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:12px 12px}
details.ex>summary::-webkit-details-marker{display:none}
.n{font-family:var(--f-display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.nm{min-width:0}
.nm b{display:block;font-weight:600;line-height:1.35}
.nm small{display:block;color:var(--muted);direction:ltr;text-align:right;font-size:12.5px}
.sr{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap;text-align:left;direction:ltr}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;margin-inline-start:6px;vertical-align:middle;border:1px solid currentColor}
.tag.alt{color:var(--new)}
.tag.chg{color:var(--accent)}
.body{padding:0 12px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.figs{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.figs figure{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.figs svg{width:96px;height:auto;display:block}
.info{flex:1;min-width:190px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.chip.p{background:var(--hot);border-color:var(--hot);color:#fff}
.chip.s{border-color:var(--warm);box-shadow:inset 0 0 0 1px var(--warm)}
.cue{margin:0}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.vid{align-self:flex-start;color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.b{fill:var(--body)}
.r *{fill:var(--mus)}
.r.s *{fill:var(--warm)}
.r.p *{fill:var(--hot)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:104px 1fr 78px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:left;direction:ltr}
.bar .v small{color:var(--muted);font-weight:400}
.note{color:var(--muted);font-size:13px;margin:10px 0 0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:360px;font-size:14px}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td small{display:block;direction:ltr;text-align:right;color:var(--muted)}
.arrow{color:var(--muted)}
[hidden]{display:none!important}
@media (max-width:420px){.bar{grid-template-columns:88px 1fr 74px}.day b{font-size:15px}}
@media (prefers-reduced-motion:no-preference){details.ex{transition:border-color .15s}details.ex[open]{border-color:var(--accent)}}
</style>
</head>

</div>

}
function minutes(day){var t=0;day.ex.forEach(function(e){t+=e.sets*(40+e.rest)+60;});return Math.round(t/60/5)*5;}
function sets(day){return day.ex.reduce(function(a,e){return a+e.sets;},0);}
function vidLink(e){
  if(e.vid)return '<a class="vid" href="'+e.vid+'" target="_blank" rel="noopener">شاهد الفيديو</a>';
  return '<a class="vid" href="https://www.youtube.com/results?search_query='+encodeURIComponent(e.en+" form")+'" target="_blank" rel="noopener">ابحث عن فيديو للتمرين</a>';
}
function chips(ids,cls){return ids.map(function(i){return '<span class="chip '+cls+'">'+MUS[i]+'</span>';}).join("");}
function card(e,i,open){
  var tag=e.tag==="alt"?'<span class="tag alt">بديل</span>':"";
  var rest=e.rest+" ثانية راحة";
  return '<details class="ex"'+(open?" open":"")+'><summary><span class="n">'+(i+1)+'</span><span class="nm"><b>'+e.ar+tag+'</b><small>'+e.en+'</small></span><span class="sr">'+e.sets+" × "+e.reps+'</span></summary>'
   +'<div class="body"><div class="figs">'+fig(FRONT,e.p,e.s,"أمامي")+fig(BACK,e.p,e.s,"خلفي")
   +'<div class="info"><div class="chips">'+chips(e.p,"p")+chips(e.s,"s")+'</div><p class="cue">'+e.cue+'</p><div class="meta">'+rest+(e.note?" · بديل "+e.note:"")+'</div>'+vidLink(e)+'</div></div>'
   +'<div class="legend"><span><i style="background:var(--hot)"></i>رئيسية</span><span><i style="background:var(--warm)"></i>مساعدة</span></div></div></details>';
}
var cur=0,st={d:0};
try{var sv=parseInt(localStorage.getItem("tm2-day"),10);if(sv>=0&&sv<4)cur=sv;}catch(x){}
function renderDays(){
  var el=document.getElementById("days");
  el.innerHTML=DAYS.map(function(d,i){return '<button class="day" role="tab" aria-selected="'+(i===cur)+'" data-i="'+i+'"><b>'+d.d+'</b><span>'+d.k+'</span></button>';}).join("");
}
function renderDay(){
  var d=DAYS[cur];
  document.getElementById("day").innerHTML='<div class="head"><h2>'+d.k+' <span style="color:var(--muted);font-size:15px;font-family:var(--f-body)" dir="ltr">'+d.en+'</span></h2><div class="stats"><span><b>'+d.ex.length+'</b> تمارين</span><span><b>'+sets(d)+'</b> مجموعة</span><span>≈ <b>'+minutes(d)+'</b> دقيقة</span></div></div><div class="list">'+d.ex.map(function(e,i){return card(e,i,i===0);}).join("")+'</div>';
}
function renderVol(){
  var rows=GROUPS.map(function(g){
    var total=0,days=0;
    DAYS.forEach(function(d){var s=0;d.ex.forEach(function(e){if(e.p.some(function(m){return g[1].indexOf(m)>-1;}))s+=e.sets;});if(s>0)days++;total+=s;});
    return{n:g[0],t:total,d:days};
  });
  var max=Math.max.apply(null,rows.map(function(r){return r.t;}));
  var total=DAYS.reduce(function(a,d){return a+sets(d);},0);
  document.getElementById("v-vol").innerHTML='<div class="panel"><h3 style="margin-bottom:12px;font-size:18px">المجموعات المباشرة في الأسبوع</h3><div class="bars">'
   +rows.map(function(r){return '<div class="bar"><span>'+r.n+'</span><span class="t"><i style="width:'+Math.round(r.t/max*100)+'%"></i></span><span class="v">'+r.t+' <small>/ '+r.d+(r.d===1?' يوم':' يومان')+'</small></span></div>';}).join("")
   +'</div><p class="note">الرقم الأول عدد المجموعات التي تكون فيها العضلة هي الرئيسية، والثاني عدد الأيام التي تُدرَّب فيها مباشرة. العضلات المساعدة غير محسوبة. إجمالي مجموعات الأسبوع: '+total+'.</p></div>'
   +'<div class="panel" style="margin-top:12px"><h3 style="margin-bottom:6px;font-size:18px">الكارديو</h3><p class="cue" style="margin:0">أبقِ الكارديو العالي الشدة في الأيام الخالية من المقاومة (الاثنين والخميس والجمعة). اجعل الصباح الرابع خفيفاً وفي يوم علوي، بعيداً عن أيام الأرجل.</p></div>';
}
function renderChg(){
  var h='<div class="panel"><h3 style="margin-bottom:6px;font-size:18px">كل التمارين استُبدلت</h3><p class="note" style="margin:0 0 10px">كل تمرين حلّ محل تمرين من الإصدار السابق في الموضع نفسه، وبالعضلة الرئيسية نفسها والمجموعات والتكرارات وفترات الراحة نفسها. لذلك لم يتغير التوزيع الأسبوعي.</p></div>';
  DAYS.forEach(function(d){
    h+='<div class="panel" style="margin-top:12px"><h3 style="margin-bottom:8px;font-size:17px">'+d.d+' · '+d.k+'</h3><div class="tbl"><table><thead><tr><th>كان</th><th>أصبح</th></tr></thead><tbody>'
      +d.ex.map(function(e){return '<tr><td><small>'+e.note+'</small></td><td>'+e.ar+'<small>'+e.en+'</small></td></tr>';}).join("")+'</tbody></table></div></div>';
  });
  document.getElementById("v-chg").innerHTML=h;
}
function show(v){
  ["days","vol","chg"].forEach(function(k){
    document.getElementById("v-"+k).hidden=(k!==v);
    document.getElementById("t-"+k).setAttribute("aria-selected",k===v);
  });
}
document.getElementById("sub").textContent="4 أيام مقاومة · "+DAYS.reduce(function(a,d){return a+d.ex.length;},0)+" تمريناً بالأجهزة والكيبل";
document.querySelector(".seg").addEventListener("click",function(e){var b=e.target.closest("button");if(b)show(b.getAttribute("data-v"));});
document.getElementById("days").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  cur=parseInt(b.getAttribute("data-i"),10);
  try{localStorage.setItem("tm2-day",String(cur));}catch(x){}
  renderDays();renderDay();
});
renderDays();renderDay();renderVol();renderChg();
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</body>
